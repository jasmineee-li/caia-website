<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | Cornell AI Alignment</title>
  <link rel="stylesheet" href="{{assets}}/tokens.css">
  <link rel="stylesheet" href="{{posterCss}}">
</head>
<body>
  <main class="post" data-format="{{format}}" data-qr-url="{{lumaUrl}}" data-composition-ready="false">
    <svg class="composition" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
    <header class="brand" data-critical data-ink>
      <img src="{{assets}}/brand/wordmark.svg" alt="Cornell AI Alignment">
    </header>
    {{sample}}
    <h1 class="headline" data-critical>{{titleMarkup}}</h1>
    <p class="summary" data-critical data-ink>{{summary}}</p>
    <section class="details">
      <div class="when" data-critical data-ink>
        <p class="label">{{weekday}}</p>
        <p class="date">{{calendarDate}}</p>
        <p class="time">{{time}}</p>
      </div>
      <div class="where" data-critical data-ink>
        <p class="label">Location</p>
        <p class="venue">{{location}}</p>
        {{foodBlock}}
      </div>
    </section>
    <div class="invitation" data-critical data-ink>
      <p class="cta">{{cta}} <span aria-hidden="true">↗</span></p>
      <p class="short-url">{{shortUrl}}</p>
    </div>
    <div class="qr" data-critical aria-label="QR code for {{lumaUrl}}">{{qr}}</div>
  </main>
  <script src="{{compositionScript}}"></script>
</body>
</html>
