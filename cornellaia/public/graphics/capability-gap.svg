<svg xmlns="http://www.w3.org/2000/svg" width="660" height="428" viewBox="0 0 660 428" fill="none" role="img" aria-labelledby="t d">
<title id="t">Capability rising faster than understanding</title>
<desc id="d">Two curves from a common origin. What AI systems can do accelerates upward, while what we understand about them rises slowly, and the gap between the two widens.</desc>
